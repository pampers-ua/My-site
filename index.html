<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const text = document.getElementById("text");
const paper = document.getElementById("paper");
const style = document.getElementById("style");
const size = document.getElementById("size");
const margin = document.getElementById("margin");
const line = document.getElementById("line");
const random = document.getElementById("random");


// ======================================================
// НАСТРОЙКИ ОБЛАСТИ ТЕКСТА ДЛЯ КАЖДОГО ФОТО
// ======================================================
//
// x      = начало текста слева
// y      = первая строка
// width  = максимальная ширина текста
// step   = расстояние между строками
//
// Эти значения относятся к холсту 1240 × 1754.
//

const pageSettings = {

    tetrad: {
        x: 125,
        y: 285,
        width: 970,
        step: 58
    },

    cell_red: {
        x: 125,
        y: 285,
        width: 970,
        step: 58
    },

    lines: {
        x: 125,
        y: 285,
        width: 970,
        step: 58
    },

    table: {
        x: 125,
        y: 285,
        width: 970,
        step: 58
    }

};


// ======================================================
// ФОТО ЛИСТОВ
// ======================================================

function getImageSrc(){

    if(paper.value === "tetrad"){
        return "https://i.postimg.cc/R0n6CBHK/IMG-1876.jpg";
    }

    if(paper.value === "cell_red"){
        return "https://i.postimg.cc/pdnhVHFr/IMG-1877.jpg";
    }

    if(paper.value === "lines"){
        return "https://i.postimg.cc/k43VBpQZ/IMG-1878.jpg";
    }

    if(paper.value === "table"){
        return "https://i.postimg.cc/RF53ND7b/IMG-1879.jpg";
    }

    return null;
}


// ======================================================
// ШРИФТ
// ======================================================

function getFont(){

    if(style.value === "caveat"){
        return "Caveat";
    }

    if(style.value === "neucha"){
        return "Neucha";
    }

    if(style.value === "pangolin"){
        return "Pangolin";
    }

    if(style.value === "badscript"){
        return "Bad Script";
    }

    return "cursive";
}


// ======================================================
// СЛУЧАЙНОЕ ОТКЛОНЕНИЕ
// ======================================================

function randomValue(n){

    return (Math.random() * 2 - 1) * n;

}


// ======================================================
// ОБНОВЛЕНИЕ ЗНАЧЕНИЙ ПОЛЗУНКОВ
// ======================================================

function updateValues(){

    document.getElementById("sizeValue").textContent =
        size.value;

    document.getElementById("marginValue").textContent =
        margin.value;

    document.getElementById("lineValue").textContent =
        line.value;

    document.getElementById("randomValue").textContent =
        random.value;

}


// ======================================================
// ПЕРЕНОС ТЕКСТА
// ======================================================

function wrapText(str, maxWidth){

    const words = str.split(/\s+/);

    const result = [];

    let current = "";

    for(const word of words){

        const test =
            current
            ? current + " " + word
            : word;

        if(
            ctx.measureText(test).width > maxWidth
            && current
        ){

            result.push(current);

            current = word;

        }else{

            current = test;

        }

    }

    if(current){

        result.push(current);

    }

    return result;

}


// ======================================================
// РИСОВАНИЕ ТЕКСТА
// ======================================================

function createText(){

    const fontSize = Number(size.value);

    const settings =
        pageSettings[paper.value] || {

            x: Number(margin.value),
            y: Number(margin.value) + fontSize,
            width:
                canvas.width -
                Number(margin.value) * 2,
            step:
                fontSize * Number(line.value)

        };


    // Размер шрифта

    ctx.font =
        fontSize +
        "px " +
        getFont() +
        ", cursive";


    // Синий цвет ручки

    ctx.fillStyle = "#1142a2";

    ctx.textBaseline = "alphabetic";


    // ==================================================
    // ПАРАМЕТРЫ ЛИСТА
    // ==================================================

    let startX = settings.x;

    let startY = settings.y;

    let maxWidth = settings.width;


    // ==================================================
    // РАССТОЯНИЕ МЕЖДУ СТРОКАМИ
    // ==================================================

    let lineHeight =
        settings.step *
        (Number(line.value) / 1.4);


    // ==================================================
    // ТЕКСТ
    // ==================================================

    const paragraphs =
        text.value
        .replace(/\r/g, "")
        .split("\n");


    let y = startY;


    for(const paragraph of paragraphs){

        // Пустая строка

        if(!paragraph.trim()){

            y += lineHeight;

            continue;

        }


        const lines =
            wrapText(
                paragraph,
                maxWidth
            );


        for(const currentLine of lines){

            // Если вышли за лист

            if(
                y >
                canvas.height -
                Number(margin.value)
            ){

                break;

            }


            let x = startX;


            // Каждая буква отдельно
            // для небольшого эффекта живого почерка

            for(const character of currentLine){

                ctx.save();


                const j =
                    Number(random.value);


                // Небольшой наклон

                ctx.translate(
                    x + randomValue(j),
                    y + randomValue(j * 0.5)
                );


                ctx.rotate(
                    randomValue(j) / 180
                );


                ctx.fillText(
                    character,
                    0,
                    0
                );


                ctx.restore();


                x +=
                    ctx.measureText(
                        character
                    ).width;

            }


            y += lineHeight;

        }

    }

}


// ======================================================
// РИСОВАНИЕ ФОТО ЛИСТА
// ======================================================

function drawPaper(){

    updateValues();


    const imageSrc =
        getImageSrc();


    // Чистый лист

    if(!imageSrc){

        ctx.fillStyle =
            "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        createText();

        return;

    }


    const img =
        new Image();


    img.crossOrigin = "anonymous";


    img.onload = function(){

        // Полностью очищаем старое изображение

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Фотография занимает весь A4

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );


        // ВАЖНО:
        // здесь больше НЕТ красной линии.
        // Она больше не рисуется программой.


        // После загрузки фотографии
        // накладываем текст

        createText();

    };


    img.onerror = function(){

        ctx.fillStyle =
            "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        createText();

    };


    img.src = imageSrc;

}


// ======================================================
// КНОПКА "СОЗДАТЬ ЛИСТ"
// ======================================================

document
.getElementById("create")
.addEventListener(
    "click",
    function(){

        drawPaper();

    }
);


// ======================================================
// СОХРАНЕНИЕ PNG
// ======================================================

document
.getElementById("save")
.addEventListener(
    "click",
    function(){

        drawPaper();


        // Небольшая задержка,
        // чтобы фотография успела загрузиться

        setTimeout(function(){

            const link =
                document.createElement("a");


            link.download =
                "HandWrite-A4.png";


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            link.click();

        }, 500);

    }
);


// ======================================================
// ИЗМЕНЕНИЕ НАСТРОЕК
// ======================================================

[
    paper,
    style,
    size,
    margin,
    line,
    random
]
.forEach(function(element){

    element.addEventListener(
        "input",
        drawPaper
    );

    element.addEventListener(
        "change",
        drawPaper
    );

});


// ======================================================
// ЗАПУСК
// ======================================================

updateValues();

drawPaper();

</script>
