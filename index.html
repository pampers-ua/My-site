
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HandWrite A4</title>
<!-- Подключаем реальные рукописные шрифты -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Marck+Script&family=Pacifico&family=Neucha&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#625c53;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:10px;
}

.panel{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 25px #0005;
}

h1{
    text-align:center;
    margin:5px 0 15px;
}

textarea{
    width:100%;
    height:160px;
    padding:12px;
    border:1px solid #bbb;
    border-radius:12px;
    font-size:17px;
    resize:vertical;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

label{
    font-size:14px;
    font-weight:bold;
}

select,
input{
    width:100%;
    margin-top:6px;
}

select{
    padding:10px;
    border:1px solid #bbb;
    border-radius:10px;
    background:white;
}

.option{
    background:#f3f3f3;
    padding:10px;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

#create{
    background:#222;
    color:white;
}

#save{
    background:#ddd;
}

.preview{
    margin-top:15px;
    padding:10px;
    background:#403c36;
    border-radius:14px;
    overflow:auto;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:white;
}

@media(max-width:600px){
    .controls{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="panel">

<h1>✍️ HandWrite A4</h1>

<textarea id="text"
placeholder="Введи или вставь сюда текст..."></textarea>

<div class="controls">

<label>
Стиль почерка
<select id="style">
<option value="caveat">Грязный (Caveat)</option>
<option value="neucha">Неровный (Neucha)</option>
<option value="pacifico">Каллиграфия (Pacifico)</option>
<option value="marck">Русский (Marck Script)</option>
<option value="comic">Блокнот (Comic Sans MS)</option>
</select>
</label>

<label>
Бумага
<select id="paper">
<option value="plain">Чистая</option>
<option value="lines">В линейку</option>
<option value="grid">В клетку</option>
<option value="yellow">Желтый блокнот</option>
</select>
</label>

<div class="option">
<label>
Размер:
<span id="sizeValue">30</span> px
</label>
<input id="size" type="range" min="16" max="60" value="30">
</div>

<div class="option">
<label>
Поля:
<span id="marginValue">70</span> px
</label>
<input id="margin" type="range" min="30" max="160" value="70">
</div>

<div class="option">
<label>
Интервал:
<span id="lineValue">1.4</span>
</label>
<input id="line" type="range" min="1" max="2" step="0.1" value="1.4">
</div>

<div class="option">
<label>
Неровность:
<span id="randomValue">2</span> px
</label>
<input id="random" type="range" min="0" max="6" value="2">
</div>

</div>

<button id="create">Создать лист</button>

<button id="save">Сохранить PNG</button>

<div class="preview">
<canvas id="canvas" width="1240" height="1754"></canvas>
</div>

</div>
</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const text=document.getElementById("text");
const paper=document.getElementById("paper");
const style=document.getElementById("style");
const size=document.getElementById("size");
const margin=document.getElementById("margin");
const line=document.getElementById("line");
const random=document.getElementById("random");

function updateValues(){

document.getElementById("sizeValue").textContent=size.value;
document.getElementById("marginValue").textContent=margin.value;
document.getElementById("lineValue").textContent=line.value;
document.getElementById("randomValue").textContent=random.value;

}

function randomValue(n){

return (Math.random()*2-1)*n;

}

function drawPaper(){

ctx.fillStyle="#fffdf8";
ctx.fillRect(0, 0, canvas.width, canvas.height);

if(paper.value==="plain"){
return;
}

if(paper.value==="yellow"){
ctx.fillStyle="#fcf6d8";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.strokeStyle="rgba(255, 0, 0, 0.3)";
ctx.lineWidth=2;
for(let y=0; y<canvas.height; y+=40){
ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(canvas.width,y);
ctx.stroke();
}
return;
}

const step = paper.value==="grid" ? 45 : 55;
ctx.strokeStyle="rgba(70,120,180,.25)";
ctx.lineWidth=2;

for(let y=margin.value; y<canvas.height; y+=step){
ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(canvas.width,y);
ctx.stroke();
}

if(paper.value==="grid"){
for(let x=0; x<canvas.width; x+=45){
ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,canvas.height);
ctx.stroke();
}
}
}

function getFont(){

if(style.value==="caveat"){
return "Caveat"; // Очень неровный, небрежный
}

if(style.value==="neucha"){
return "Neucha"; // Русский небрежный
}

if(style.value==="pacifico"){
return "Pacifico"; // Каллиграфия
}

if(style.value==="marck"){
return "Marck Script"; // Русский
}

if(style.value==="comic"){
return "Comic Sans MS"; // Блокнот
}

return "Caveat";

}

function wrapText(str,maxWidth){

const words=str.split(/\s+/);
const result=[];
let current="";

for(const word of words){
const test=current ? current+" "+word : word;

if(ctx.measureText(test).width>maxWidth && current){
result.push(current);
current=word;
}else{
current=test;
}
}

if(current){ result.push(current); }
return result;

}

function createPage(){

updateValues();
drawPaper();

const fontSize=Number(size.value);
const m=Number(margin.value);
const spacing=Number(line.value);

// Случайный наклон всего текста (небрежный эффект)
const baseTilt = (Math.random()*2-1)*0.05; // Наклон от -3 до 3 градусов

ctx.font = fontSize + "px " + getFont() + ", cursive";
ctx.fillStyle="#202020";
ctx.textBaseline="alphabetic";

const maxWidth=canvas.width-m*2;
const lineHeight=fontSize*spacing;

let y=m+fontSize;
const paragraphs=text.value.replace(/\r/g,"").split("\n");

// Ограничение области
ctx.save();
ctx.beginPath();
ctx.rect(0, 0, canvas.width, canvas.height);
ctx.clip();

for(const paragraph of paragraphs){

if(!paragraph.trim()){
y+=lineHeight;
continue;
}

const lines=wrapText(paragraph, maxWidth);

for(const currentLine of lines){

if(y>canvas.height-m){
break;
}

let x=m;

for(const character of currentLine){

ctx.save();
const j=Number(random.value);

// Случайный сдвиг по вертикали (дрожание)
const yOffset = randomValue(j) * 0.5;
// Случайная ротация (больше неровности)
ctx.rotate(randomValue(j)/150 + baseTilt);
// Случайный сдвиг по X
ctx.translate(x + randomValue(j), y + yOffset);

ctx.fillText(character, 0, 0);
ctx.restore();

x+=ctx.measureText(character).width;
}

y+=lineHeight;
}
}

ctx.restore();
}

document.getElementById("create").addEventListener("click", createPage);

document.getElementById("save").addEventListener("click", function(){
createPage();
const link=document.createElement("a");
link.download="HandWrite-A4.png";
link.href=canvas.toDataURL("image/png");
link.click();
});

[paper, style, size, margin, line, random].forEach(element=>{
element.addEventListener("input", createPage);
element.addEventListener("change", createPage);
});

updateValues();
createPage();

</script>

</body>
</html>
